commands:
  prepare: |-
    rtk proxy bash -lc '
      target_dir="${NAUTILUS_GATE_TARGET_DIR:-${CARGO_TARGET_DIR:-${CARGO_TARGET_ROOT:+$CARGO_TARGET_ROOT/nautilus}}}"
      target_dir="${target_dir:-$HOME/.cache/nautilus-no-mistakes-target}"
      env CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-2}" TARGET_DIR="$target_dir" make build-debug
    '
  test: |-
    rtk proxy bash -lc '
      cd python &&
      env \
        PYTHONPATH="$PWD" \
        PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
        VIRTUAL_ENV= \
        uv run --no-sync python -m pytest -q \
          tests/unit/backtest/test_tardis_option_chain_example.py \
          tests/unit/persistence/test_option_greeks_replay.py \
          tests/unit/backtest/strict_l2 \
          tests/unit/model/test_option_pricing_validation.py
    '

pr:
  base_branch: develop

document:
  instructions: >-
    Rust Python binding doc comments are generated from their non-Python Rust owners by
    python/generate_docstrings.py. Keep generated files reproducible and use the generator's
    crate-scoped dry run when documentation changes touch them. Do not invoke workspace-wide
    Cargo builds or Clippy from the document step; commands.prepare and commands.test own
    compilation and behavioral validation for this gate.

test:
  instructions: >-
    Reuse the repository-managed Python environment and native extension prepared by
    commands.prepare. Drive focused observable behavior for the changed surface; do
    not rebuild the extension during the agent test phase and do not run cargo nextest,
    workspace-wide Rust tests, or broad linters. The explicit commands.test invocation
    is the complete test scope for this branch.
